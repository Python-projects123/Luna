<body style="margin: 0;">
    <div id="container" style="background-color: #0EB361; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
        <div id="grid" style="position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background-image: linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 40px 40px; transition: transform 0.1s ease-out;"></div>
        <p style="position: relative; z-index: 1; font-family: 'Times New Roman', Times, serif; font-style: italic; margin: 0; padding: 14px; color: #121D2F; font-size: 64px;">Luna.</p>
    </div>

    <script>
        const container = document.getElementById('container');
        const grid = document.getElementById('grid');

        container.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 40;
            grid.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
