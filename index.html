<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna</title>
  <style>
    :root {
      --bg: #151515;
      --text: #F4F4F4;
      --muted: #F4F4F4;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.12) 1px, transparent 1px);
      background-size: 64px 64px;
      background-position: calc(50% + var(--grid-x, 0px)) calc(50% + var(--grid-y, 0px));
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 45%, transparent 85%);
      mask-image: radial-gradient(circle at 50% 50%, #000 45%, transparent 85%);
      pointer-events: none;
      z-index: 0;
      transition: background-position 0.2s ease-out;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
    p {
      margin: 0;
      font-size: clamp(0.8rem, 1.4vw, 0.95rem);
      color: var(--muted);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Luna</h1>
  <p><em>Run one of the fastest AI models just in your computer.</em></p>
  <script>
    const root = document.documentElement;
    window.addEventListener('pointermove', (event) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 40;
      const y = (event.clientY / window.innerHeight - 0.5) * 40;
      root.style.setProperty('--grid-x', `${x}px`);
      root.style.setProperty('--grid-y', `${y}px`);
    });
  </script>
</body>
</html>
